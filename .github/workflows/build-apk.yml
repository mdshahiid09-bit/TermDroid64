name: Build TermDroid64 (arm64-v8a) APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android NDK, CMake & SDK 34
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK (arm64-v8a)
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TermDroid64-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
